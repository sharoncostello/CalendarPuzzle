<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whole Year Puzzle</title>
<style>
  :root{
    --birch: #e8dcc4;
    --birch-line: #c9b98e;
    --walnut-1: #4a2e1e;
    --walnut-2: #6b4226;
    --walnut-3: #7f5539;
    --walnut-4: #8b5e3c;
    --walnut-5: #9c6644;
    --walnut-6: #a97142;
    --walnut-7: #b08968;
    --walnut-8: #835c3b;
    --walnut-9: #5c3a21;
    --ink: #2b1c12;
    --paper: #f4ecd8;
    --accent: #b5651d;
    --shadow: rgba(30,18,8,0.35);
  }

  * { box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #3a281c 0%, #241a12 60%, #1a120c 100%);
    font-family: 'Iowan Old Style','Georgia', 'Palatino Linotype', serif;
    color: var(--paper);
  }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 20px 60px;
  }

  header{
    text-align:center;
    margin-bottom: 28px;
  }

  .brandmark{
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--walnut-6);
    margin-bottom: 6px;
  }

  h1{
    font-family: 'Copperplate','Trajan Pro', 'Iowan Old Style', serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 46px);
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--paper);
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  .sub{
    margin-top: 8px;
    color: #cbb896;
    font-style: italic;
    font-size: 15px;
  }

  .panel{
    background: linear-gradient(180deg, #efe4c8, #e4d5ac);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 18px 40px var(--shadow), inset 0 0 0 1px rgba(90,60,30,0.25);
    color: var(--ink);
  }

  .controls{
    display:flex;
    flex-wrap: wrap;
    align-items:flex-end;
    gap: 18px;
    justify-content: center;
    margin-bottom: 20px;
    padding-bottom: 18px;
    border-bottom: 2px dashed var(--birch-line);
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--walnut-2);
    font-weight: 600;
  }

  select{
    font-family: inherit;
    font-size: 16px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--walnut-6);
    background: var(--paper);
    color: var(--ink);
    min-width: 110px;
  }

  button{
    font-family: inherit;
    cursor:pointer;
    border: none;
    border-radius: 9px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  button:active{ transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  button:disabled{ opacity:0.4; cursor:default; transform:none; box-shadow:none; }

  .btn-solve{
    background: linear-gradient(180deg, var(--accent), #8f4713);
    color: #fff3e0;
  }
  .btn-next{
    background: linear-gradient(180deg, #6b4226, #4a2e1e);
    color: #f4ecd8;
  }
  .btn-ghost{
    background: transparent;
    border: 1.5px solid var(--walnut-5);
    color: var(--walnut-2);
    box-shadow:none;
    padding: 8px 14px;
  }

  .board-frame{
    background: var(--birch);
    border-radius: 10px;
    padding: 14px;
    box-shadow: inset 0 0 0 2px var(--birch-line), inset 0 0 18px rgba(90,60,20,0.25);
    display:flex;
    justify-content:center;
    width: fit-content;
    margin: 0 auto;
  }

  .board{
    position: relative;
  }

  .cell{
    position:absolute;
    border-radius: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    background: #f6ecd4;
    border: 3px solid var(--birch);
    box-sizing: border-box;
    box-shadow: inset 0 0 0 1px rgba(120,90,50,0.35), inset 0 -2px 3px rgba(120,90,50,0.15);
    user-select: none;
  }
  .cell.blank{ visibility:hidden; box-shadow:none; border:none; background:transparent; }

  .cell.target{
    background: #fff8e6;
    color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent), inset 0 0 0 1px rgba(120,90,50,0.35);
    font-weight: 800;
    z-index: 2;
  }

  .cell.filled{
    color: rgba(255,255,255,0.95);
    font-size: 12px;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
    border-radius: 0;
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.35),
      inset 0 -3px 5px rgba(0,0,0,0.3);
  }

  .status-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 2px dashed var(--birch-line);
  }

  .difficulty{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .stars{ font-size: 20px; letter-spacing: 3px; color: var(--accent); }
  .stars .empty{ color: #d8c9a3; }
  .diff-label{ font-size: 13px; color: var(--walnut-2); }

  .solution-nav{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .solution-count{
    font-size: 14px;
    color: var(--walnut-2);
    min-width: 130px;
    text-align:center;
  }
  .arrow-btn{
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--walnut-5);
    color: var(--walnut-2);
    font-size: 16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }

  .message{
    text-align:center;
    color: var(--walnut-2);
    font-style: italic;
    font-size: 14px;
    margin-top: 6px;
    min-height: 18px;
  }

  footer{
    text-align:center;
    margin-top: 26px;
    font-size: 12px;
    color: #a9926c;
  }

  @media (max-width: 560px){
    .board{ grid-template-columns: repeat(7, minmax(30px, 42px)); grid-template-rows: repeat(7, minmax(30px, 42px)); gap:4px; }
    .cell{ font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandmark">Est. in Plywood &amp; Patience</div>
    <h1>The Whole Year Puzzle</h1>
    <div class="sub">Pick a month and day — cover everything else with all nine pieces.</div>
  </header>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label for="monthSelect">Month</label>
        <select id="monthSelect"></select>
      </div>
      <div class="field">
        <label for="daySelect">Day</label>
        <select id="daySelect"></select>
      </div>
      <button class="btn-solve" id="solveBtn">Solve</button>
      <button class="btn-next" id="nextDayBtn">Next Day →</button>
    </div>

    <div class="board-frame">
      <div class="board" id="board"></div>
    </div>

    <div class="status-row">
      <div class="difficulty">
        <span class="stars" id="stars">☆☆☆☆☆</span>
        <span class="diff-label" id="diffLabel">Pick a date and solve to see difficulty</span>
      </div>
      <div class="solution-nav">
        <button class="arrow-btn" id="prevSol">‹</button>
        <span class="solution-count" id="solCount">—</span>
        <button class="arrow-btn" id="nextSol">›</button>
      </div>
    </div>
    <div class="message" id="message"></div>
  </div>

  <footer>Palmetto Puzzles</footer>
</div>

<script>
/* ---------------------------------------------------------------------
   BOARD DEFINITION
   7 columns x 7 rows. Missing cells: row0/row1 col6 (top-right notch),
   row6 cols 3-6 (bottom-right notch). 43 valid cells = 12 months + 31 days.
--------------------------------------------------------------------- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function buildCells(){
  const cells = [];
  for(let c=0;c<6;c++) cells.push({row:0,col:c,label:MONTHS[c],type:'month',val:c});
  for(let c=0;c<6;c++) cells.push({row:1,col:c,label:MONTHS[6+c],type:'month',val:6+c});
  for(let r=2;r<=5;r++){
    for(let c=0;c<7;c++){
      const day = (r-2)*7 + c + 1;
      cells.push({row:r,col:c,label:String(day),type:'day',val:day});
    }
  }
  for(let c=0;c<3;c++) cells.push({row:6,col:2+c,label:String(29+c),type:'day',val:29+c});
  return cells;
}
const CELLS = buildCells();
const CELL_BY_KEY = {};
CELLS.forEach(cell=>{ cell.key = cell.row+','+cell.col; CELL_BY_KEY[cell.key]=cell; });
const VALID_KEYS = new Set(CELLS.map(c=>c.key));

/* ---------------------------------------------------------------------
   PIECE DEFINITIONS
--------------------------------------------------------------------- */
const PIECES = [
  { name:'Cross',    color:'#D9534F', cells:[[0,1],[1,0],[1,1],[1,2],[2,1]] },
  { name:'Short L',  color:'#E0954F', cells:[[0,0],[1,0],[2,0],[2,1]] },
  { name:'Long L',   color:'#D9B84F', cells:[[0,0],[1,0],[2,0],[3,0],[3,1]] },
  { name:'T-Shape',  color:'#6FAE6E', cells:[[0,0],[0,1],[0,2],[1,1]] },
  { name:'U-Shape',  color:'#5FA8A0', cells:[[0,0],[0,2],[1,0],[1,1],[1,2]] },
  { name:'Z-Shape',  color:'#5B85C4', cells:[[0,0],[0,1],[1,1],[2,1],[2,2]] },
  { name:'Square',   color:'#8177C4', cells:[[0,0],[0,1],[1,0],[1,1]] },
  { name:'Flat-Z',   color:'#A374B5', cells:[[0,1],[0,2],[1,0],[1,1]] },
  { name:'Boot',     color:'#C05C8F', cells:[[0,0],[1,0],[0,1],[1,1],[2,1]] },
];

function normalize(shape){
  const minR = Math.min(...shape.map(p=>p[0]));
  const minC = Math.min(...shape.map(p=>p[1]));
  return shape.map(([r,c])=>[r-minR,c-minC]).sort((a,b)=> a[0]-b[0] || a[1]-b[1]);
}
function rotate90(shape){ return normalize(shape.map(([r,c])=>[c,-r])); }
function flipShape(shape){ return normalize(shape.map(([r,c])=>[r,-c])); }
function shapeKey(shape){ return shape.map(p=>p.join(':')).join('|'); }

function generateOrientations(baseShape){
  const found = new Map();
  let variants = [baseShape, flipShape(baseShape)];
  variants.forEach(v=>{
    let s = normalize(v);
    for(let i=0;i<4;i++){
      const k = shapeKey(s);
      if(!found.has(k)) found.set(k, s);
      s = rotate90(s);
    }
  });
  return Array.from(found.values());
}

PIECES.forEach(p=>{ p.orientations = generateOrientations(p.cells); });

/* ---------------------------------------------------------------------
   SOLVER (backtracking exact cover)
--------------------------------------------------------------------- */
const MAX_SOLUTIONS = 400;
const MAX_NODES = 3000000;

function solveBoard(excludeKeys){
  const blocked = new Set(excludeKeys);
  const occupied = new Map(); // key -> {pieceIdx, pieceName}
  const solutions = [];
  const orderedCells = CELLS.slice().sort((a,b)=> a.row-b.row || a.col-b.col);
  let nodes = 0;
  const usedPiece = new Array(PIECES.length).fill(false);

  function firstEmpty(){
    for(const cell of orderedCells){
      if(blocked.has(cell.key)) continue;
      if(!occupied.has(cell.key)) return cell;
    }
    return null;
  }

  function backtrack(){
    if(solutions.length >= MAX_SOLUTIONS) return;
    if(nodes++ > MAX_NODES) return;
    const anchor = firstEmpty();
    if(!anchor){
      const snap = {};
      occupied.forEach((v,k)=>{ snap[k] = v; });
      solutions.push(snap);
      return;
    }
    for(let pi=0; pi<PIECES.length; pi++){
      if(usedPiece[pi]) continue;
      const piece = PIECES[pi];
      for(const orient of piece.orientations){
        for(let ci=0; ci<orient.length; ci++){
          const dr = anchor.row - orient[ci][0];
          const dc = anchor.col - orient[ci][1];
          const translated = orient.map(([r,c])=>[r+dr,c+dc]);
          let ok = true;
          const keys = [];
          for(const [r,c] of translated){
            const k = r+','+c;
            if(!VALID_KEYS.has(k) || blocked.has(k) || occupied.has(k)){ ok=false; break; }
            keys.push(k);
          }
          if(!ok) continue;
          keys.forEach(k=> occupied.set(k, {pieceIdx:pi, pieceName:piece.name}));
          usedPiece[pi] = true;
          backtrack();
          usedPiece[pi] = false;
          keys.forEach(k=> occupied.delete(k));
          if(solutions.length >= MAX_SOLUTIONS) return;
        }
      }
    }
  }

  backtrack();
  return { solutions, capped: solutions.length >= MAX_SOLUTIONS };
}

/* ---------------------------------------------------------------------
   UI STATE
--------------------------------------------------------------------- */
const today = new Date();
const state = {
  month: today.getMonth(),
  day: Math.min(today.getDate(), 31),
  solutions: [],
  capped: false,
  solIndex: 0
};

const monthSelect = document.getElementById('monthSelect');
const daySelect = document.getElementById('daySelect');
const boardEl = document.getElementById('board');
const starsEl = document.getElementById('stars');
const diffLabelEl = document.getElementById('diffLabel');
const solCountEl = document.getElementById('solCount');
const messageEl = document.getElementById('message');

MONTHS.forEach((m,i)=>{
  const opt = document.createElement('option');
  opt.value = i; opt.textContent = m;
  monthSelect.appendChild(opt);
});
for(let d=1; d<=31; d++){
  const opt = document.createElement('option');
  opt.value = d; opt.textContent = d;
  daySelect.appendChild(opt);
}

function getCellSize(){
  const frame = document.querySelector('.board-frame');
  const panel = document.querySelector('.panel');
  const available = (panel ? panel.clientWidth : 500) - 2*22 - 2*14; // panel padding + frame padding
  let size = Math.floor(available / 7);
  size = Math.max(34, Math.min(62, size));
  return size;
}

function renderBoard(){
  boardEl.innerHTML = '';
  const maxRow = 6, maxCol = 6;
  const targetMonthCell = CELLS.find(c=>c.type==='month' && c.val===state.month);
  const targetDayCell = CELLS.find(c=>c.type==='day' && c.val===state.day);

  const currentSolution = state.solutions[state.solIndex] || null;
  const cellSize = getCellSize();
  boardEl.style.width = (cellSize*7) + 'px';
  boardEl.style.height = (cellSize*7) + 'px';

  for(let r=0;r<=maxRow;r++){
    for(let c=0;c<=maxCol;c++){
      const key = r+','+c;
      const div = document.createElement('div');
      div.className = 'cell';
      div.style.left = (c*cellSize) + 'px';
      div.style.top = (r*cellSize) + 'px';
      div.style.width = cellSize + 'px';
      div.style.height = cellSize + 'px';
      div.style.fontSize = Math.round(cellSize*0.25) + 'px';
      if(!VALID_KEYS.has(key)){
        div.classList.add('blank');
        boardEl.appendChild(div);
        continue;
      }
      const cellData = CELL_BY_KEY[key];
      div.textContent = cellData.label;

      const isTarget = (cellData.key===targetMonthCell.key) || (cellData.key===targetDayCell.key);
      if(isTarget){
        div.classList.add('target');
      } else if(currentSolution && currentSolution[key]){
        div.classList.add('filled');
        div.style.fontSize = Math.round(cellSize*0.2) + 'px';
        const pIdx = currentSolution[key].pieceIdx;
        const pieceColor = PIECES[pIdx].color;
        div.style.background = pieceColor;
        div.title = currentSolution[key].pieceName;

        const neighborSamePiece = (nr,nc)=>{
          const nk = nr+','+nc;
          const n = currentSolution[nk];
          return n && n.pieceIdx === pIdx;
        };
        const BLACK = '#0a0602';
        div.style.borderTopColor    = neighborSamePiece(r-1,c) ? pieceColor : BLACK;
        div.style.borderBottomColor = neighborSamePiece(r+1,c) ? pieceColor : BLACK;
        div.style.borderLeftColor   = neighborSamePiece(r,c-1) ? pieceColor : BLACK;
        div.style.borderRightColor  = neighborSamePiece(r,c+1) ? pieceColor : BLACK;
      }
      boardEl.appendChild(div);
    }
  }
}

let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderBoard, 120);
});

function starRating(n, capped){
  // n = number of solutions found (fewer = harder)
  let stars;
  if(n<=0) stars = 0;
  else if(capped || n>=100) stars = 1;
  else if(n>=30) stars = 2;
  else if(n>=10) stars = 3;
  else if(n>=3) stars = 4;
  else stars = 5;
  return stars;
}

function renderDifficulty(){
  const n = state.solutions.length;
  if(n===0){
    starsEl.innerHTML = '<span class="empty">☆☆☆☆☆</span>';
    diffLabelEl.textContent = state.searched ? 'No solution found for this date' : 'Pick a date and solve to see difficulty';
    return;
  }
  const stars = starRating(n, state.capped);
  let filled = '★'.repeat(stars);
  let empty = '☆'.repeat(5-stars);
  starsEl.innerHTML = filled + '<span class="empty">'+empty+'</span>';
  const countText = state.capped ? (MAX_SOLUTIONS+'+') : n;
  const labels = {1:'Easy',2:'So-So',3:'Moderate',4:'Tricky',5:'Brutal'};
  diffLabelEl.textContent = `${labels[stars]} — ${countText} solution${n===1?'':'s'} found`;
}

function renderSolutionNav(){
  const n = state.solutions.length;
  if(n===0){
    solCountEl.textContent = '—';
    document.getElementById('prevSol').disabled = true;
    document.getElementById('nextSol').disabled = true;
    return;
  }
  const total = state.capped ? (MAX_SOLUTIONS+'+') : n;
  solCountEl.textContent = `Solution ${state.solIndex+1} of ${total}`;
  document.getElementById('prevSol').disabled = false;
  document.getElementById('nextSol').disabled = false;
}

function doSolve(){
  const monthCell = CELLS.find(c=>c.type==='month' && c.val===state.month);
  const dayCell = CELLS.find(c=>c.type==='day' && c.val===state.day);
  messageEl.textContent = 'Solving…';
  // allow UI to paint before heavy work
  setTimeout(()=>{
    const result = solveBoard([monthCell.key, dayCell.key]);
    state.solutions = result.solutions;
    state.capped = result.capped;
    state.solIndex = 0;
    state.searched = true;
    if(state.solutions.length===0){
      messageEl.textContent = 'No arrangement of all nine pieces leaves exactly this date open.';
    } else {
      messageEl.textContent = '';
    }
    renderBoard();
    renderDifficulty();
    renderSolutionNav();
  }, 20);
}

function daysInCycle(){ return 31; } // board treats every month as having day cells 1-31

function goNextDay(){
  let d = state.day + 1;
  let m = state.month;
  if(d > 31){ d = 1; m = (m+1) % 12; }
  state.month = m; state.day = d;
  monthSelect.value = m; daySelect.value = d;
  doSolve();
}

document.getElementById('solveBtn').addEventListener('click', ()=>{
  state.month = parseInt(monthSelect.value,10);
  state.day = parseInt(daySelect.value,10);
  doSolve();
});
document.getElementById('nextDayBtn').addEventListener('click', goNextDay);
document.getElementById('prevSol').addEventListener('click', ()=>{
  if(state.solutions.length===0) return;
  state.solIndex = (state.solIndex - 1 + state.solutions.length) % state.solutions.length;
  renderBoard(); renderSolutionNav();
});
document.getElementById('nextSol').addEventListener('click', ()=>{
  if(state.solutions.length===0) return;
  state.solIndex = (state.solIndex + 1) % state.solutions.length;
  renderBoard(); renderSolutionNav();
});

// init
monthSelect.value = state.month;
daySelect.value = state.day;
renderBoard();
renderDifficulty();
renderSolutionNav();
doSolve();
</script>
</body>
</html>
